<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Traffic Management System</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    text-align: center;
}

header {
    background: #1f2937;
    color: white;
    padding: 20px;
}

header h1 {
    margin: 0;
}

.dashboard {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.junction {
    position: relative;
    width: 650px;
    max-width: 95%;
    height: 430px;
    margin: 20px auto;
    background: #777;
    border: 8px solid #444;
    overflow: hidden;
}

/* Roads */

.vertical-road {
    position: absolute;
    width: 170px;
    height: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
}

.horizontal-road {
    position: absolute;
    height: 170px;
    width: 100%;
    top: 50%;
    transform: translateY(-50%);
    background: #333;
}

/* Road markings */

.road-line-v {
    position: absolute;
    width: 5px;
    height: 100%;
    left: 50%;
    transform: translateX(-50%);
    border-left: 4px dashed white;
}

.road-line-h {
    position: absolute;
    height: 5px;
    width: 100%;
    top: 50%;
    transform: translateY(-50%);
    border-top: 4px dashed white;
}

/* Traffic lights */

.traffic-light {
    position: absolute;
    background: #111;
    padding: 6px;
    border-radius: 10px;
    z-index: 5;
}

.light {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #444;
    margin: 4px;
}

.red.active {
    background: red;
}

.yellow.active {
    background: yellow;
}

.green.active {
    background: limegreen;
}

.north {
    top: 90px;
    left: 62%;
}

.south {
    bottom: 90px;
    left: 32%;
}

.east {
    right: 90px;
    top: 35%;
}

.west {
    left: 90px;
    top: 55%;
}

/* Cars */

.vehicle {
    position: absolute;
    font-size: 30px;
    z-index: 4;
}

.north-car {
    top: 15px;
    left: 47%;
}

.south-car {
    bottom: 15px;
    left: 47%;
}

.east-car {
    right: 15px;
    top: 46%;
}

.west-car {
    left: 15px;
    top: 46%;
}

/* Status */

#status {
    font-size: 22px;
    font-weight: bold;
    margin: 15px;
}

/* Cards */

.info {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
}

.card {
    background: white;
    padding: 15px;
    width: 200px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #bbb;
}

.high {
    color: red;
    font-weight: bold;
}

.medium {
    color: orange;
    font-weight: bold;
}

.low {
    color: green;
    font-weight: bold;
}

button {
    border: none;
    padding: 15px 25px;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
    background: #dc2626;
    color: white;
    margin: 20px;
}

button:hover {
    opacity: 0.85;
}

footer {
    padding: 20px;
    color: #555;
}
</style>
</head>

<body>

<header>
<h1>🚦 Smart Traffic Management System</h1>
<p>Optimizing Urban Mobility</p>
</header>

<div class="dashboard">

<h2>Live Traffic Junction</h2>

<div class="junction">

<div class="vertical-road"></div>
<div class="horizontal-road"></div>

<div class="road-line-v"></div>
<div class="road-line-h"></div>

<!-- North traffic light -->
<div class="traffic-light north">
<div id="north-red" class="light red"></div>
<div id="north-yellow" class="light yellow"></div>
<div id="north-green" class="light green"></div>
</div>

<!-- South traffic light -->
<div class="traffic-light south">
<div id="south-red" class="light red"></div>
<div id="south-yellow" class="light yellow"></div>
<div id="south-green" class="light green"></div>
</div>

<!-- East traffic light -->
<div class="traffic-light east">
<div id="east-red" class="light red"></div>
<div id="east-yellow" class="light yellow"></div>
<div id="east-green" class="light green"></div>
</div>

<!-- West traffic light -->
<div class="traffic-light west">
<div id="west-red" class="light red"></div>
<div id="west-yellow" class="light yellow"></div>
<div id="west-green" class="light green"></div>
</div>

<div class="vehicle north-car">🚗</div>
<div class="vehicle south-car">🚗</div>
<div class="vehicle east-car">🚙</div>
<div class="vehicle west-car">🚕</div>

</div>

<div id="status">
System starting...
</div>

<div class="info">

<div class="card">
<h3>North</h3>
<p class="high">HIGH</p>
<p>Vehicles: <span id="north-count">18</span></p>
</div>

<div class="card">
<h3>East</h3>
<p class="medium">MEDIUM</p>
<p>Vehicles: <span id="east-count">10</span></p>
</div>

<div class="card">
<h3>South</h3>
<p class="low">LOW</p>
<p>Vehicles: <span id="south-count">4</span></p>
</div>

<div class="card">
<h3>West</h3>
<p class="high">HIGH</p>
<p>Vehicles: <span id="west-count">16</span></p>
</div>

</div>

<button onclick="emergency()">
🚑 Emergency Vehicle
</button>

</div>

<footer>
Smart Traffic Management System | ESP32 + AI + IoT Concept
</footer>

<script>

const roads = ["north", "east", "south", "west"];

let traffic = {
    north: 18,
    east: 10,
    south: 4,
    west: 16
};

let currentRoad = 0;
let activeRoad = "north";
let emergencyMode = false;


/* Update vehicle numbers */

function updateCounts() {

    document.getElementById("north-count").innerText = traffic.north;
    document.getElementById("east-count").innerText = traffic.east;
    document.getElementById("south-count").innerText = traffic.south;
    document.getElementById("west-count").innerText = traffic.west;

}


/* Turn all lights off */

function turnOffAll() {

    roads.forEach(road => {

        document.getElementById(road + "-red")
        .classList.remove("active");

        document.getElementById(road + "-yellow")
        .classList.remove("active");

        document.getElementById(road + "-green")
        .classList.remove("active");

    });

}


/* Set green signal */

function setSignal(road) {

    activeRoad = road;

    turnOffAll();

    roads.forEach(r => {

        if (r === road) {

            document.getElementById(r + "-green")
            .classList.add("active");

        } else {

            document.getElementById(r + "-red")
            .classList.add("active");

        }

    });

    document.getElementById("status").innerText =
        road.toUpperCase() + " ROAD → GREEN";

}


/* Change signal */

function changeSignal() {

    if (emergencyMode) return;

    let road = roads[currentRoad];

    setSignal(road);

    currentRoad++;

    if (currentRoad >= roads.length) {
        currentRoad = 0;
    }

}


/* Every second vehicles leave green road */

setInterval(function() {

    if (!emergencyMode && traffic[activeRoad] > 0) {

        traffic[activeRoad]--;

        updateCounts();

    }

}, 1000);


/* Every 5 seconds change signal */

setInterval(function() {

    if (!emergencyMode) {

        changeSignal();

    }

}, 5000);


/* Emergency vehicle */

function emergency() {

    emergencyMode = true;

    turnOffAll();

    roads.forEach(road => {

        if (road === "north") {

            document.getElementById("north-green")
            .classList.add("active");

        } else {

            document.getElementById(road + "-red")
            .classList.add("active");

        }

    });

    document.getElementById("status").innerText =
        "🚑 EMERGENCY PRIORITY → NORTH ROAD GREEN";


    setTimeout(function() {

        emergencyMode = false;

        document.getElementById("status").innerText =
            "Normal traffic operation resumed";

        changeSignal();

    }, 8000);

}


/* Start */

updateCounts();
changeSignal();

</script>

</body>
</html>
